# Two ways to run:
#
#   docker compose up --build                        cloud LLM (fast — no model download)
#   docker compose --profile local-llm up --build    fully offline via Ollama (~2GB pull)
#
# Cloud mode reads backend/.env for LLM_PROVIDER / LLM_CLOUD_* — copy
# backend/.env.example to backend/.env and fill in your key first.
services:
  # Only started with `--profile local-llm`. In cloud mode there's no reason to
  # pull a 2GB model that will never be used.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull qwen2.5:3b-instruct"]
    restart: "no"

  backend:
    build: ./backend
    # Optional so cloud config is picked up when present, without making the
    # file mandatory for a purely local-LLM run.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Inside the compose network Ollama is a service name, not localhost.
      # Set here rather than in .env so the same .env works natively too.
      LLM_LOCAL_BASE_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:5173
      # Native ML libs (onnxruntime/ctranslate2) size their thread pools from the
      # HOST's CPU count rather than the container's limit, which can over-allocate
      # and cause heap corruption ("corrupted double-linked list") under load.
      OMP_NUM_THREADS: "1"
      OMP_WAIT_POLICY: "PASSIVE"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
      - model_cache:/root/.cache

  frontend:
    build: .
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  ollama_data:
  backend_storage:
  model_cache:
